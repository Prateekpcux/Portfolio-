<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

.pw-page{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:40px 24px;position:relative;overflow:hidden;background:#fff;}

.pw-card>p{font-size:15px;color:#666;line-height:1.65;margin-bottom:28px;}
.pw-input-label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#aaa;display:block;margin-bottom:8px;}
.pw-input{width:100%;padding:13px 16px;border:1.5px solid #e8e8e8;border-radius:10px;font-size:15px;font-family:'DM Sans',sans-serif;color:#1a1a1a;outline:none;transition:border-color .2s,box-shadow .2s;background:#fafafa;display:block;}
.pw-input:focus{border-color:#084FAA;background:#fff;box-shadow:0 0 0 3px rgba(8,79,170,.1);}
.pw-input::placeholder{color:#bbb;}
.pw-error{display:none;font-size:13px;color:#c0392b;align-items:center;gap:6px;padding:8px 12px;background:#fff5f5;border:1px solid #fecaca;border-radius:8px;margin-top:10px;}
.pw-btn{width:100%;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#084FAA,#1a6fd4);color:#fff;font-size:15px;font-weight:600;padding:14px 24px;border-radius:10px;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(8,79,170,.28);transition:transform .2s,box-shadow .2s,opacity .2s;font-family:'DM Sans',sans-serif;letter-spacing:.2px;}
.pw-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(8,79,170,.36);}
.pw-btn:active{transform:translateY(0);}
.pw-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.pw-divider{display:flex;align-items:center;gap:12px;margin:20px 0;}
.pw-divider::before,.pw-divider::after{content:'';flex:1;height:1px;background:#f0f0f0;}
.pw-divider span{font-size:12px;color:#ccc;font-weight:500;}
.pw-links{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.pw-links a{font-size:13px;font-weight:500;color:#888;text-decoration:none;transition:color .2s;}
.pw-links a:hover{color:#084FAA;}
.pw-links a:first-child{color:#084FAA;font-weight:600;}
.pw-links a:first-child:hover{text-decoration:underline;}

<script>
var _a=0,_l=false,_k='p8x2k9mQ',_d=[17,91,23,0,89,13,89,96,72,8,65,0,89,126,42,21,69,11,74,1,95,11,94,101,67,11,75,0,69,81,25,60,28];
async function _h(s){var b=new TextEncoder().encode(s);var hb=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(hb)).map(x=>x.toString(16).padStart(2,'0')).join('');}
function _r(a,k){return a.map((c,i)=>String.fromCharCode(c^k.charCodeAt(i%k.length))).join('');}
async function checkPw(){
  if(_l)return;
  var input=document.getElementById('pw');
  var err=document.getElementById('pw-error');

  var v=input.value;

  _a++;
  if(_a>=5){_l=true;err.innerText='Too many attempts. Request access via email.';err.style.display='flex';input.disabled=true;btn.disabled=true;return;}
  btn.textContent='Checking...';btn.disabled=true;
  var h=await _h(v);
  if(h==='2bfc4598fa57ee8dfabb53d0b7363faafe2be292ca2d9d8e7cc1ace55d954d64'){
    btn.textContent='✓ Access granted - opening...';
    setTimeout(()=>{window.location.href=_r(_d,_k);},400);
  }else{
    err.innerText='Wrong password - '+(5-_a)+' attempt'+(5-_a===1?'':'s')+' remaining.';
    err.style.display='flex';input.style.borderColor='#fca5a5';input.style.background='#fff5f5';
    btn.textContent='Access Case Study →';btn.disabled=false;
    await new Promise(r=>setTimeout(r,900+Math.random()*300));
    input.style.borderColor='';input.style.background='';
  }
}
</script>
